<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- NOTE brings in all css from bootstrap using the web! -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
  <!-- NOTE make sure your style sheet loads in after bootstrap's -->
  <link rel="stylesheet" href="style.css">
  <title>Bootstrap Intro</title>
</head>

<body>
  <header class="p-3">
    <!-- NOTE container or a container-fluid class will always start your grid -->
    <div class="container">
      <!-- NOTE row classes are how we split a container up vertically -->
      <div class="row">
        <div class="col-2">
          <span>Boomerang</span>
        </div>
        <div class="col-8">
          <nav class="d-flex justify-content-between">
            <a href="">Home</a>
            <!-- NOTE href attribute can take in links and will navigate the user to that page when clicked -->
            <a href="https://unsplash.com/photos/gray-fish-on-white-coral-reef-CIV0DPeMc3w" target="_blank">Pages</a>
            <a href="">Portfolio</a>
            <a href="">Blog</a>
            <a href="">Shop</a>
            <a href="">Components</a>
            <a href="">Demos</a>
          </nav>
        </div>
        <div class="col-2">
          <span>🛒 🍔</span>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="container-fluid">
      <section class="row align-items-center barracuda-bg">
        <div class="col-12">
          <div class="text-center p-3 text-light">
            <h1 class="text-shadow">
              Your customers will love you
              one minute from now.
            </h1>
            <p class="fw-bold text-shadow fs-5">
              See how your users experience your website in realtime or view
              trends to see any changes in performance over time.
            </p>
            <button class="btn btn-primary fs-5">Get Started</button>
            <button class="btn btn-outline-light fs-5">Learn More</button>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>

</html>
